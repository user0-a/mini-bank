<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Bank</title>
<style>
  :root {
    --bg:#f5f5f7; --panel:rgba(255,255,255,.86); --panel-solid:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
    --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f2ff;
    --in:#34c759; --out:#ff3b30; --dep:#007aff; --warn:#ff9500;
    --shadow:0 18px 50px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.04);
    --soft-shadow:0 8px 28px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --panel:rgba(28,28,30,.78); --panel-solid:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#38383d;
      --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:#08233f;
      --in:#30d158; --out:#ff453a; --dep:#64d2ff; --warn:#ffd60a; --shadow:none; --soft-shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; background:
    radial-gradient(circle at 18% -10%, rgba(0,113,227,.16), transparent 34%),
    radial-gradient(circle at 86% 0%, rgba(52,199,89,.12), transparent 28%),
    var(--bg); color:var(--ink); }
  button, input, select { font:inherit; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }

  header { display:grid; grid-template-columns:1fr repeat(3, auto) auto; align-items:center; gap:14px; padding:34px 24px 24px; max-width:1240px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:24px; letter-spacing:-.035em; margin-right:auto; }
  .logo { width:38px; height:38px; border-radius:12px; background:linear-gradient(145deg, #0a84ff, #0057d9); color:var(--accent-ink); display:grid; place-items:center; font-size:17px; box-shadow:0 10px 24px rgba(0,113,227,.28); }
  .stat { min-width:118px; padding:12px 14px; border:1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius:18px; background:color-mix(in srgb, var(--panel-solid) 72%, transparent); backdrop-filter:blur(22px); box-shadow:var(--soft-shadow); display:flex; flex-direction:column; }
  .stat b { font-size:18px; letter-spacing:-.035em; line-height:1.1; }
  .stat span { margin-top:4px; font-size:11px; color:var(--muted); letter-spacing:-.01em; }
  .live { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); padding:10px 12px; border:1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius:999px; background:color-mix(in srgb, var(--panel-solid) 66%, transparent); backdrop-filter:blur(22px); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--in); animation:pulse 2s infinite; }
  .live.off .dot { background:var(--out); animation:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  main { max-width:1240px; margin:0 auto; padding:0 24px 56px; display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:24px; align-items:start; }
  @media (max-width: 980px) { header { grid-template-columns:1fr 1fr; } .brand { grid-column:1 / -1; } main { grid-template-columns:1fr; } header, main { padding-left:16px; padding-right:16px; } }
  @media (max-width: 560px) { header { grid-template-columns:1fr; padding-top:22px; } .stat, .live { width:100%; } }

  .panel { background:var(--panel); border:1px solid color-mix(in srgb, var(--line) 72%, transparent); border-radius:28px; box-shadow:var(--shadow); padding:22px; backdrop-filter:blur(24px); }
  .panel h2 { margin:0 0 18px; font-size:20px; letter-spacing:-.03em; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .side { display:grid; gap:24px; position:sticky; top:18px; }
  @media (max-width: 980px) { .side { position:static; } }

  .btn { border:0; border-radius:999px; padding:10px 16px; cursor:pointer; background:var(--accent); color:var(--accent-ink); font-weight:600; letter-spacing:-.01em; box-shadow:0 8px 18px rgba(0,113,227,.18); transition:transform .16s ease, filter .16s ease, box-shadow .16s ease; }
  .btn:hover { filter:brightness(1.05); transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,113,227,.22); }
  .btn.ghost { background:color-mix(in srgb, var(--panel-solid) 62%, transparent); color:var(--ink); border:1px solid var(--line); font-weight:500; box-shadow:none; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost.danger { color:var(--out); margin-left:auto; }
  .btn.btn-danger { background:var(--out); color:#fff; }
  .confirm { border:1px solid color-mix(in srgb, var(--out) 45%, var(--line)); background:color-mix(in srgb, var(--out) 7%, transparent);
    border-radius:20px; padding:16px; margin-bottom:16px; }
  .confirm .sub { font-size:13px; color:var(--muted); }
  .confirm select { max-width:320px; }

  label { display:block; font-size:12px; color:var(--muted); margin:0 0 6px; font-weight:500; }
  .field { margin-bottom:14px; }
  input, select { width:100%; padding:12px 13px; border-radius:14px; border:1px solid color-mix(in srgb, var(--line) 80%, transparent); background:color-mix(in srgb, var(--panel-solid) 70%, transparent); outline:none; transition:border-color .16s, box-shadow .16s, background .16s; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); background:var(--panel-solid); }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; min-height:1em; }
  .pair { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:end; }
  .swap { height:44px; width:44px; padding:0; border-radius:50%; border:1px solid var(--line); background:color-mix(in srgb, var(--panel-solid) 70%, transparent); cursor:pointer; margin-bottom:14px; }
  .amount-input { font-size:26px; font-weight:700; letter-spacing:-.04em; padding:14px 13px; }

  /* konta */
  .accounts { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .acc { text-align:left; border:1px solid color-mix(in srgb, var(--line) 72%, transparent); background:linear-gradient(180deg, color-mix(in srgb, var(--panel-solid) 92%, transparent), color-mix(in srgb, var(--panel-solid) 66%, transparent)); border-radius:24px; padding:18px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; position:relative; box-shadow:var(--soft-shadow); }
  .acc:hover { transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow:0 18px 38px rgba(0,0,0,.09); }
  .acc.sel { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft), var(--soft-shadow); }
  .acc .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .avatar { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.28); }
  .acc .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc .nr { font-size:12px; color:var(--muted); }
  .acc .bal { font-size:25px; font-weight:750; letter-spacing:-.045em; }
  .acc .bal small { font-size:13px; font-weight:500; color:var(--muted); }
  .flash-up { animation:up 1.4s; } .flash-down { animation:down 1.4s; }
  @keyframes up { 0%{background:color-mix(in srgb, var(--in) 25%, transparent)} 100%{background:transparent} }
  @keyframes down { 0%{background:color-mix(in srgb, var(--out) 25%, transparent)} 100%{background:transparent} }
  .empty { color:var(--muted); padding:34px; text-align:center; border:1px dashed var(--line); border-radius:22px; background:color-mix(in srgb, var(--panel-solid) 45%, transparent); }

  .new-form { display:none; grid-template-columns:1fr 170px auto; gap:10px; margin-bottom:18px; }
  .new-form.open { display:grid; }
  @media (max-width: 560px) { .new-form.open { grid-template-columns:1fr; } }

  /* szczegóły konta */
  .detail { margin-top:24px; display:none; }
  .detail.open { display:block; }
  .detail-head { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:14px; }
  .detail-head .bal { font-size:32px; font-weight:750; letter-spacing:-.05em; margin-left:auto; }
  .row-actions { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .row-actions input { width:160px; }

  /* operacje */
  .ops { list-style:none; margin:0; padding:0; }
  .op { display:grid; grid-template-columns:36px 1fr auto; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .op:last-child { border-bottom:0; }
  .op .ic { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:15px; background:color-mix(in srgb, var(--panel-solid) 62%, transparent); }
  .op .what { min-width:0; }
  .op .what div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .op .sub { font-size:12px; color:var(--muted); }
  .op .amt { font-weight:600; text-align:right; }
  .op.new { animation:slide .5s ease-out, up 1.6s; }
  @keyframes slide { from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none} }
  .c-in { color:var(--in); } .c-out { color:var(--out); } .c-dep { color:var(--dep); }
  .feed { max-height:460px; overflow:auto; margin:0 -22px -22px; padding:0 22px 4px; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; background:rgba(29,29,31,.92); color:#fff;
    padding:12px 18px; border-radius:999px; font-weight:500; transition:.25s; pointer-events:none; max-width:calc(100% - 32px); z-index:10; backdrop-filter:blur(20px); }
  .toast.show { opacity:1; transform:translateX(-50%); }
  .toast.err { background:var(--out); color:#fff; }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">zł</div>Mini Bank</div>
  <div class="stat"><b class="num" id="s-total">0,00 zł</b><span>Środki w banku</span></div>
  <div class="stat"><b class="num" id="s-acc">0</b><span>Konta</span></div>
  <div class="stat"><b class="num" id="s-ops">0</b><span>Operacje</span></div>
  <div class="live" id="live"><span class="dot"></span><span id="live-txt">na żywo</span></div>
</header>

<main>
  <div>
    <section class="panel">
      <h2>Konta <button class="btn" id="toggle-new">+ Nowe konto</button></h2>
      <form class="new-form" id="f-new">
        <input name="owner" placeholder="Imię i nazwisko właściciela" required maxlength="100">
        <input name="initial_balance" placeholder="Saldo początkowe" inputmode="decimal">
        <button class="btn">Załóż</button>
      </form>
      <div class="accounts" id="accounts"></div>
    </section>

    <section class="panel detail" id="detail">
      <div class="detail-head">
        <div class="avatar" id="d-avatar"></div>
        <div><div style="font-weight:700;font-size:17px" id="d-name"></div><div class="sub" style="color:var(--muted);font-size:13px" id="d-nr"></div></div>
        <div class="bal num" id="d-bal"></div>
      </div>
      <div class="row-actions">
        <form id="f-deposit" style="display:flex;gap:8px">
          <input name="amount" placeholder="Kwota wpłaty" inputmode="decimal" required>
          <button class="btn">Wpłać</button>
        </form>
        <button class="btn ghost" id="d-send">Przelej z tego konta →</button>
        <button class="btn ghost" id="d-close">Zamknij</button>
        <button class="btn ghost danger" id="d-delete">Usuń konto</button>
      </div>
      <form class="confirm" id="f-delete" hidden>
        <div style="font-weight:600;margin-bottom:6px">Na pewno usunąć to konto?</div>
        <div class="sub" style="margin-bottom:10px">Konto zniknie z listy i nie będzie można na nie przelewać. Historia operacji zostaje.</div>
        <div class="field" id="del-target-wrap" hidden>
          <label id="del-target-label"></label>
          <select name="transfer_to" id="del-target"></select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-danger">Tak, usuń konto</button>
          <button type="button" class="btn ghost" id="del-cancel">Anuluj</button>
        </div>
      </form>
      <ul class="ops" id="d-history"></ul>
    </section>
  </div>

  <div class="side">
    <section class="panel">
      <h2>Przelew</h2>
      <form id="f-transfer">
        <div class="pair">
          <div class="field"><label>Z konta</label><select name="from_account" id="t-from" required></select></div>
          <button type="button" class="swap" id="t-swap" title="Zamień">⇄</button>
          <div class="field"><label>Na konto</label><select name="to_account" id="t-to" required></select></div>
        </div>
        <div class="hint" id="t-avail" style="margin:-6px 0 10px"></div>
        <div class="field"><label>Kwota (zł)</label><input class="amount-input num" name="amount" id="t-amount" placeholder="0,00" inputmode="decimal" required></div>
        <div class="field"><label>Tytuł</label><input name="title" placeholder="np. Za pizzę" maxlength="140"></div>
        <button class="btn" style="width:100%" id="t-btn">Wyślij przelew</button>
      </form>
    </section>

    <section class="panel">
      <h2>Co się dzieje <span class="sub" style="font-weight:400;font-size:12px;color:var(--muted)">odświeża się samo</span></h2>
      <div class="feed"><ul class="ops" id="feed"></ul></div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amt = v => String(v).trim().replace(/\s/g,'').replace(',', '.');
const fmt = v => Number(v).toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' zł';
const COLORS = ['#0f766e','#7c3aed','#c2410c','#2563eb','#be185d','#4d7c0f','#0369a1','#a16207'];
const color = id => COLORS[(id - 1) % COLORS.length];
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
const when = iso => {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return 'przed chwilą';
  if (s < 3600) return `${Math.floor(s/60)} min temu`;
  return d.toLocaleString('pl-PL', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
};

let accounts = [], allAccounts = [], prevBal = {}, selected = null, lastOpId = null, firstLoad = true;
const ownerOf = id => allAccounts.find(a => a.id === id)?.owner ?? '#' + id;

function toast(text, err=false) {
  const t = $('#toast'); t.textContent = text; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 3000);
}

async function api(path, body, method) {
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  if (method) opts.method = method;
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(Array.isArray(d) ? d.map(e => e.msg.replace(/^Value error, /,'')).join('; ') : (d || res.statusText));
  }
  return data;
}

function renderAccounts() {
  const total = accounts.reduce((s, a) => s + Number(a.balance), 0);
  $('#s-total').textContent = fmt(total);
  $('#s-acc').textContent = accounts.length;

  $('#accounts').innerHTML = accounts.length ? accounts.map(a => {
    const p = prevBal[a.id], cls = p === undefined || firstLoad ? '' : Number(a.balance) > p ? 'flash-up' : Number(a.balance) < p ? 'flash-down' : '';
    return `<button class="acc ${a.id === selected ? 'sel' : ''} ${cls}" data-id="${a.id}">
      <div class="top"><div class="avatar" style="background:${color(a.id)}">${esc(initials(a.owner))}</div>
        <div style="min-width:0"><div class="name">${esc(a.owner)}</div><div class="nr">Konto nr ${a.id}</div></div></div>
      <div class="bal num">${fmt(a.balance).replace(' zł','')} <small>zł</small></div></button>`;
  }).join('') : '<div class="empty">Nie ma jeszcze żadnych kont. Kliknij „+ Nowe konto”.</div>';
  accounts.forEach(a => prevBal[a.id] = Number(a.balance));

  const opts = accounts.map(a => `<option value="${a.id}">#${a.id} · ${esc(a.owner)}</option>`).join('');
  for (const sel of [$('#t-from'), $('#t-to')]) {
    if (sel.dataset.opts === opts) continue;  // nie przebudowuj listy, gdy nic się nie zmieniło (nie zamyka rozwiniętej listy)
    const prev = sel.value; sel.innerHTML = opts; sel.dataset.opts = opts;
    if (prev && accounts.some(a => String(a.id) === prev)) sel.value = prev;
  }
  if (!$('#t-to').dataset.touched && accounts.length > 1 && $('#t-to').value === $('#t-from').value) $('#t-to').selectedIndex = 1;
  updateAvail();
}

function updateAvail() {
  const a = accounts.find(a => String(a.id) === $('#t-from').value);
  $('#t-avail').textContent = a ? `Dostępne: ${fmt(a.balance)}` : 'Załóż co najmniej dwa konta, żeby robić przelewy.';
  $('#t-btn').disabled = accounts.length < 2;
}

function opRow(o, isNew) {
  let ic, cls, title, sub = esc(o.title || '');
  if (o.kind === 'deposit') {
    ic = '↓'; cls = 'c-dep'; title = `Wpłata · ${esc(o.to_owner)}`;
  } else {
    ic = '→'; cls = ''; title = `${esc(o.from_owner)} → ${esc(o.to_owner)}`;
  }
  return `<li class="op ${isNew ? 'new' : ''}"><div class="ic ${cls}">${ic}</div>
    <div class="what"><div>${title}</div><div class="sub">${sub ? sub + ' · ' : ''}${when(o.created_at)}</div></div>
    <div class="amt num ${cls}">${fmt(o.amount)}</div></li>`;
}

function renderFeed(ops) {
  $('#s-ops').textContent = ops.length >= 100 ? '100+' : ops.length;
  const known = lastOpId;
  $('#feed').innerHTML = ops.length ? ops.map(o => opRow(o, !firstLoad && known !== null && o.id > known)).join('')
    : '<li class="empty">Tu pojawią się wpłaty i przelewy.</li>';
  if (ops.length) lastOpId = ops[0].id;
}

async function renderDetail() {
  const a = accounts.find(a => a.id === selected);
  if (!a) { $('#detail').classList.remove('open'); selected = null; return; }
  $('#detail').classList.add('open');
  $('#d-avatar').textContent = initials(a.owner); $('#d-avatar').style.background = color(a.id);
  $('#d-name').textContent = a.owner; $('#d-nr').textContent = `Konto nr ${a.id}`;
  $('#d-bal').textContent = fmt(a.balance);
  const hist = await api(`/accounts/${a.id}/history`);
  $('#d-history').innerHTML = hist.length ? hist.map(o => {
    const out = o.direction === 'out', dep = o.kind === 'deposit';
    const other = esc(ownerOf(o.counterparty));
    const title = dep ? 'Wpłata' : out ? `Przelew do: ${other}` : `Przelew od: ${other}`;
    const cls = dep ? 'c-dep' : out ? 'c-out' : 'c-in';
    return `<li class="op"><div class="ic ${cls}">${dep ? '↓' : out ? '↑' : '↓'}</div>
      <div class="what"><div>${title}</div><div class="sub">${o.title ? esc(o.title) + ' · ' : ''}${when(o.created_at)}</div></div>
      <div class="amt num ${cls}">${o.amount.startsWith('-') ? '−' : '+'}${fmt(o.amount.slice(1))}</div></li>`;
  }).join('') : '<li class="empty">Brak operacji na tym koncie.</li>';
}

async function refresh() {
  try {
    const [acc, ops] = await Promise.all([api('/accounts?include_closed=true'), api('/operations?limit=100')]);
    allAccounts = acc;                              // z zamkniętymi — do nazw w historii
    accounts = acc.filter(a => !a.closed_at);       // aktywne — na liście i w formularzach
    renderAccounts(); renderFeed(ops);
    if (selected) await renderDetail();
    firstLoad = false;
    $('#live').classList.remove('off'); $('#live-txt').textContent = 'na żywo';
  } catch (e) {
    $('#live').classList.add('off'); $('#live-txt').textContent = 'brak połączenia z serwerem';
  }
}

/* zdarzenia */
$('#toggle-new').onclick = () => { $('#f-new').classList.toggle('open'); $('#f-new [name=owner]').focus(); };
$('#accounts').onclick = e => {
  const card = e.target.closest('.acc'); if (!card) return;
  selected = Number(card.dataset.id) === selected ? null : Number(card.dataset.id);
  hideDelete();
  renderAccounts(); renderDetail();
  if (selected) $('#detail').scrollIntoView({behavior:'smooth', block:'nearest'});
};
$('#d-close').onclick = () => { selected = null; hideDelete(); renderAccounts(); renderDetail(); };

/* usuwanie konta */
function hideDelete() { $('#f-delete').hidden = true; }
$('#d-delete').onclick = () => {
  const a = accounts.find(a => a.id === selected); if (!a) return;
  const others = accounts.filter(x => x.id !== a.id);
  const hasMoney = Number(a.balance) > 0;
  $('#del-target-wrap').hidden = !hasMoney;
  $('#del-target').required = hasMoney;
  $('#del-target-label').textContent = `Na koncie jest ${fmt(a.balance)}. Przelej je na konto:`;
  $('#del-target').innerHTML = others.map(x => `<option value="${x.id}">#${x.id} · ${esc(x.owner)}</option>`).join('');
  if (hasMoney && !others.length) { toast('Na koncie są pieniądze, a nie ma innego konta, na które można je przelać. Najpierw załóż drugie konto.', true); return; }
  $('#f-delete').hidden = false;
};
$('#del-cancel').onclick = hideDelete;
handle($('#f-delete'), async d => {
  const a = accounts.find(a => a.id === selected);
  const q = Number(a.balance) > 0 ? `?transfer_to=${d.transfer_to}` : '';
  const r = await api(`/accounts/${a.id}${q}`, null, 'DELETE');
  hideDelete(); selected = null;
  toast(r.moved_balance ? `Usunięto konto ${a.owner}. ${fmt(r.moved_balance.amount)} przelano do: ${ownerOf(r.moved_balance.to_account)}`
                        : `Usunięto konto ${a.owner}`);
});
$('#d-send').onclick = () => { $('#t-from').value = selected; updateAvail(); $('#t-amount').focus(); };
$('#t-from').onchange = updateAvail;
$('#t-to').onchange = () => $('#t-to').dataset.touched = 1;
$('#t-swap').onclick = () => { const f = $('#t-from').value; $('#t-from').value = $('#t-to').value; $('#t-to').value = f; updateAvail(); };

function handle(form, fn) {
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button:not([type=button])'); btn.disabled = true;
    try {
      await fn(Object.fromEntries(new FormData(form)));
      const keep = [...form.querySelectorAll('select')].map(s => [s, s.value]);  // wybrane konta zostają
      form.reset(); keep.forEach(([s, v]) => s.value = v);
      await refresh();
    }
    catch (err) { toast(err.message, true); }
    finally { btn.disabled = false; updateAvail(); }
  });
}

handle($('#f-new'), async d => {
  const a = await api('/accounts', {owner:d.owner, initial_balance: amt(d.initial_balance || '0')});
  selected = a.id; $('#f-new').classList.remove('open');
  toast(`Założono konto nr ${a.id} dla: ${a.owner}`);
});
handle($('#f-transfer'), async d => {
  const t = await api('/transfers', {from_account:+d.from_account, to_account:+d.to_account, amount:amt(d.amount), title:d.title});
  const n = id => accounts.find(a => a.id === id)?.owner ?? '#' + id;
  toast(`Przelano ${fmt(t.amount)}: ${n(t.from_account)} → ${n(t.to_account)}`);
});
handle($('#f-deposit'), async d => {
  const a = await api(`/accounts/${selected}/deposit`, {amount:amt(d.amount)});
  toast(`Wpłacono na konto ${a.owner}`);
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
